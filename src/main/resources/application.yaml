spring:
  application:
    name: Image-Processing-Service
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables from your entities. Fine for dev; use migrations in prod.
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  storage:
    type: ${STORAGE_TYPE:local} # "local" or "supabase"
    local:
      root: ./uploads
    supabase:
      endpoint: ${SUPABASE_S3_ENDPOINT:}
      region: ${SUPABASE_S3_REGION:}
      access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID:}
      secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY:}
      bucket: ${SUPABASE_S3_BUCKET:images}
  app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 900000 # 15 minutes
      refresh-expiration-ms: 604800000 # 7 days
